<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombol Pengubah Warna Latar Belakang Secara Acak - T5_074</title>
    <!-- Link ke Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .full-height {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container-fluid full-height">
        <div class="text-center">
            <h1>Mengubah warna latar belakang halaman </h1>
            
            <!-- Tombol untuk mengubah warna latar belakang -->
            <button id="warnaButton" class="btn btn-success btn-lg">Ubah Warna Latar Belakang</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const warnaButton = document.getElementById('warnaButton');

            // Fungsi untuk menghasilkan warna acak dalam format hex
            function getRandomColor() {
                const letters = '0123456789ABCDEF';
                let color = '#';
                for (let i = 0; i < 6; i++) {
                    color += letters[Math.floor(Math.random() * 16)];
                }
                return color;
            }

            // Event listener untuk mengubah warna latar belakang saat tombol diklik
            warnaButton.addEventListener('click', () => {
                document.body.style.backgroundColor = getRandomColor();  // Mengubah latar belakang ke warna acak
            });
        });
    </script>
</body>

</html>
