<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Penghitung Jumlah Klik - T4_074</title>
    <!-- Link ke Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .full-height {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container-fluid full-height">
        <div class="text-center">
            <h1>Aplikasi Penghitung Jumlah Klik</h1>
            
            <!-- Tombol Bootstrap -->
            <button id="klikButton" class="btn btn-primary btn-lg">Klik Saya!</button>
            
            <!-- Menampilkan jumlah klik -->
            <p id="jumlahKlik" class="mt-3">Jumlah Klik: 0</p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let totalKlik = 0;  // Inisialisasi jumlah klik

            const klikButton = document.getElementById('klikButton');
            const jumlahKlik = document.getElementById('jumlahKlik');

            klikButton.addEventListener('click', () => {
                totalKlik++;  // Menambah jumlah klik setiap kali tombol diklik
                jumlahKlik.textContent = `Jumlah Klik: ${totalKlik}`;  // Menampilkan jumlah klik
            });
        });
    </script>
</body>

</html>
